name: Android Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME set, licenses accepted);
      # AGP downloads any missing platform/build-tools itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK (signed, installable)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (minified)
        id: release
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/*.apk "out/WClient-debug-${SHORT_SHA}.apk"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "out/WClient-release-${SHORT_SHA}.apk"
          fi
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WClient-APK-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release build status
        if: steps.release.outcome == 'failure'
        run: echo "::warning::Release (minified) build failed - debug APK was still produced. Check ProGuard rules."
