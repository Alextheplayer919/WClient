name: Android Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME set, licenses accepted);
      # AGP downloads any missing platform/build-tools itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The test tasks are listed alongside the APK build so CI actually runs the relay/Network unit
      # tests - nothing ran them before, including the split-packet and codec-registry regressions.
      # tee keeps the log for the annotation step below; pipefail so a compiler failure still fails the step.
      - name: Build debug APK (signed, installable)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :relay:test :relay:Network:transport-raknet:test \
            --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # The raw job log is served from a blob store that is not always reachable from tooling, and a wall
      # of javac output buries the mistake. Mirror the first errors into check annotations, which the PR
      # UI and `gh api /check-runs/{id}/annotations` both surface.
      - name: Report first build errors
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            grep -nE "(^| )(error:|e: file:|FAILED|What went wrong)" /tmp/build.log |
              head -40 |
              while IFS= read -r line; do
                msg="${line#*:}"
                printf '::error::%s\n' "${msg//%/%25}"
              done
          fi

      - name: Build release APK (minified)
        id: release
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/*.apk "out/WClient-debug-${SHORT_SHA}.apk"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "out/WClient-release-${SHORT_SHA}.apk"
          fi
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WClient-APK-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release build status
        if: steps.release.outcome == 'failure'
        run: echo "::warning::Release (minified) build failed - debug APK was still produced. Check ProGuard rules."
